[package]
name = "motus_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
dotenvy = "0.15.7"
html-escape = "0.2.13"
ratatui = "0.30.2"
regex = "1.12.4"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
textwrap = "0.16.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.18"
urlencoding = "2.1.3"
